    <text x="0" y="28" font-size="13" fill="#ffffff">1. Automacon WCS Starter — на ценовом уровне базовой поставки Körber HighJump при бóльшей функциональности WCS «из коробки».</text>
    <text x="0" y="52" font-size="13" fill="#ffffff">2. Automacon WCS Professional — нижняя половина диапазона Manhattan Active, без пользовательской лицензии и без зависимости от ERP.</text>
    <text x="0" y="76" font-size="13" fill="#ffffff">3. Multi-Site Enterprise (13 заводов) — экономия 30 % к прайсу «по площадкам», в мировой вилке 20–35 %.</text>
    <text x="0" y="100" font-size="13" fill="#ffffff">4. Все цены — отраслевые ориентиры на 1H 2026 г., источники указаны в «Справке о рыночных ценах».</text>
